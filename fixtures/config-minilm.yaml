# Scope for the synthetic corpus. Committed, and safe to commit: the corpus is fiction.
# Used by the test suite and by the public evaluation set (ADR 0008), so anyone who clones
# this repository can reproduce the published public numbers with no private data.
scope:
  default_profile: fixture
  profiles:
    fixture:
      roots:
        - corpus
  defaults:
    suffixes: [.md, .markdown]
    skip_nested_repos: true

index:
  path: ./.index-minilm

embeddings:
  # The real model, for the comparison against the hashing baseline. Not used by CI,
  # which cannot rely on a model download; see fixtures/config.yaml for that path.
  provider: sentence-transformers
  model: sentence-transformers/all-MiniLM-L6-v2

retrieval:
  candidates: 50

generation:
  provider: none
