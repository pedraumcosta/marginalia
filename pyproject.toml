[project]
name = "marginalia"
version = "0.1.0"
description = "Retrieval over a Markdown knowledge wiki. Local embeddings, section-path citations, measured."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pedraum Sujera" }]
keywords = ["rag", "retrieval", "markdown", "knowledge-management", "embeddings"]

# Core stays deliberately small: stdlib sqlite3 (FTS5) + numpy + yaml.
# Embeddings and generation are extras so the package imports without them.
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Install CPU-only torch first, or pip resolves several GB of NVIDIA CUDA packages that
# this project never uses (ADR 0003 runs the model on CPU):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
embed = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
marginalia = "marginalia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
