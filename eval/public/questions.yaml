# Public golden set over the synthetic corpus in fixtures/corpus/.
#
# Committed and run in CI, so anyone cloning the repository can reproduce the published
# public numbers with no private data (ADR 0008). The corpus is fiction, so these
# questions leak nothing.
#
# Relevance is judged on document + section rather than on the citation string, because
# citations carry a part suffix for split sections and chunk sizing is a knob we expect to
# turn. `section` matches a numbered heading; `heading` matches any heading in the path;
# a bare document name means any chunk of it counts.

- id: longitude-hard
  question: Why is longitude harder to determine than latitude?
